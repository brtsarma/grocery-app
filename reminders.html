
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FamilyHub Reminders</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-4">
    
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-3xl font-bold text-gray-800">FamilyHub Reminders</h1>
        <p class="text-gray-500">Subscriptions, doctor appointments, tasks, bills</p>
      </div>

      <a href="index.html" class="text-blue-600 underline">Grocery</a>
    </div>

    <div class="bg-white rounded-xl shadow p-4 mb-6">
      <h2 class="text-xl font-semibold mb-4">Add Reminder</h2>

      <div class="grid gap-3">
        <input id="titleInput" class="border rounded p-2" placeholder="Reminder title" />

        <select id="categoryInput" class="border rounded p-2">
          <option value="Subscription">Subscription</option>
          <option value="Doctor">Doctor</option>
          <option value="Meeting">Meeting</option>
          <option value="Bill">Bill</option>
          <option value="Family">Family</option>
          <option value="Car">Car</option>
          <option value="Home">Home</option>
          <option value="Other">Other</option>
        </select>

        <input id="dateInput" type="date" class="border rounded p-2" />
        <input id="timeInput" type="time" class="border rounded p-2" />

        <textarea id="notesInput" class="border rounded p-2" placeholder="Notes"></textarea>

        <button id="addBtn" class="bg-blue-600 text-white rounded p-2 font-semibold">
          Add Reminder
        </button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="text-xl font-semibold mb-4">My Reminders</h2>
      <div id="reminderList" class="space-y-3"></div>
    </div>

  </div>

  <script type="module" src="./reminders.js"></script>
</body>
</html>
